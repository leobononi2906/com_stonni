<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stonni — Portal do Representante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A3A8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stonni">
<link rel="apple-touch-icon" href="logo.png">
<style>
/* ============================================================
   DESIGN SYSTEM BONONI / STONNI
   ============================================================ */
:root {
  --bg: #F0F3F8;
  --surface: #FFFFFF;
  --surface2: #F7F9FC;
  --border: #E2E8F2;
  --blue-dark: #1A3A8F;
  --blue-mid: #0077CC;
  --blue-light: #00AAEE;
  --blue-pale: #E8F4FD;
  --text-primary: #0F1D35;
  --text-secondary: #5A6A85;
  --text-muted: #9AA5B8;
  --green: #0F9D6E;    --green-bg: #E8F8F3;
  --red: #D93025;      --red-bg: #FEF0EF;
  --orange: #E07B00;   --orange-bg: #FEF5E7;
  --yellow: #B45309;   --yellow-bg: #FFFBEB;
  --shadow-sm: 0 1px 3px rgba(15,29,53,0.06), 0 1px 2px rgba(15,29,53,0.04);
  --shadow-md: 0 4px 16px rgba(15,29,53,0.08), 0 2px 4px rgba(15,29,53,0.04);
  --shadow-lg: 0 12px 40px rgba(15,29,53,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); font-size: 14px; }

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0F1D35 0%, #1A3A8F 50%, #0077CC 100%);
  z-index: 1000;
}
#login-screen.hidden { display: none; }

.login-box {
  background: var(--surface);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  display: flex; flex-direction: column; align-items: center; margin-bottom: 32px;
}
.login-logo-mark {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--blue-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -1px;
  margin-bottom: 12px;
}
.login-logo h1 { font-size: 22px; font-weight: 700; color: var(--blue-dark); letter-spacing: -0.5px; }
.login-logo p { font-size: 12px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input {
  width: 100%; height: 42px; padding: 0 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary);
  background: var(--surface2); outline: none; transition: border-color 0.15s;
}
.form-group input:focus { border-color: var(--blue-mid); background: #fff; }

.btn-login {
  width: 100%; height: 44px; background: var(--blue-dark); color: #fff;
  border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  margin-top: 8px;
}
.btn-login:hover { background: var(--blue-mid); }
.login-error { font-size: 12px; color: var(--red); text-align: center; margin-top: 10px; min-height: 16px; }

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display: none; }
#app.visible { display: block; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w); background: var(--blue-dark);
  position: fixed; left: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column; z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-logo-inner {
  display: flex; align-items: center; gap: 10px;
}
.sidebar-logo-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--blue-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.sidebar-logo-text { flex: 1; overflow: hidden; }
.sidebar-logo-text h2 { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.sidebar-logo-text span { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.nav-group-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
  color: rgba(255,255,255,0.3); text-transform: uppercase;
  padding: 12px 20px 6px; margin-top: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 20px; cursor: pointer;
  color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500;
  transition: all 0.15s; border-radius: 0; position: relative;
  text-decoration: none;
}
.nav-item:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.06); }
.nav-item.active { color: var(--blue-light); background: rgba(0,170,238,0.15); }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--blue-light); border-radius: 0 2px 2px 0;
}
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 10px;
  background: var(--red); color: #fff;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
.user-role { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
.btn-logout {
  margin-top: 12px; width: 100%; padding: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm); color: rgba(255,255,255,0.5);
  font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer;
  transition: all 0.15s;
}
.btn-logout:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

/* MAIN */
.main {
  position: fixed; left: var(--sidebar-w); right: 0; top: 0; bottom: 0;
  overflow-y: auto; display: flex; flex-direction: column;
}

/* TOPBAR */
.topbar {
  height: 60px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0; position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow-sm);
}
.topbar-left {}
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.topbar-breadcrumb { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

/* CONTENT */
.content { padding: 20px 24px 32px; flex: 1; }

/* ============================================================
   COMPONENTES COMUNS
   ============================================================ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-sm);
}
.card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.card-value { font-size: 26px; font-weight: 700; font-family: 'DM Mono', monospace; letter-spacing: -0.5px; }
.card-value.green { color: var(--green); }
.card-value.red   { color: var(--red); }
.card-value.blue  { color: var(--blue-mid); }
.card-value.orange{ color: var(--orange); }
.card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.cards-grid { display: grid; gap: 14px; }
.cards-grid-4 { grid-template-columns: repeat(4, 1fr); }
.cards-grid-3 { grid-template-columns: repeat(3, 1fr); }
.cards-grid-2 { grid-template-columns: repeat(2, 1fr); }

.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.table-card-title { font-size: 13px; font-weight: 600; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); background: var(--surface2); border-bottom: 1px solid var(--border); }
.data-table td { padding: 11px 16px; border-bottom: 1px solid var(--border); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--surface2); }
.data-table td.right { text-align: right; }
.data-table td.mono { font-family: 'DM Mono', monospace; font-size: 12.5px; }
.data-table tr.clickable { cursor: pointer; }

.badge { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
.badge-rascunho  { background: var(--surface2);    color: var(--text-muted); }
.badge-enviado   { background: var(--blue-pale);   color: var(--blue-mid); }
.badge-aprovado  { background: var(--green-bg);    color: var(--green); }
.badge-reprovado { background: var(--red-bg);      color: var(--red); }
.badge-faturado  { background: #F3E8FF;             color: #7C3AED; }
.badge-cancelado { background: var(--surface2);    color: var(--text-muted); }
  .badge-cotacao  { background: #faf5ff; color: #7c3aed; border: 1px solid #ddd6fe; }
  .badge-warning  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .badge-faturado { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-esgotado  { background: var(--red-bg);      color: var(--red); }
.badge-disponivel{ background: var(--green-bg);    color: var(--green); }

.btn { height: 34px; padding: 0 14px; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
.btn-primary { background: var(--blue-dark); color: #fff; }
.btn-primary:hover { background: var(--blue-mid); }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { filter: brightness(1.1); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { filter: brightness(1.1); }
.btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--surface2); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-lg { height: 42px; padding: 0 20px; font-size: 14px; }

.toggle-group { display: flex; gap: 4px; }
.toggle-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.toggle-btn.active { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }

.form-field { margin-bottom: 16px; }
.form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; height: 38px; padding: 0 12px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-primary);
  background: var(--surface2); outline: none; transition: border-color 0.15s;
}
.form-field textarea { height: auto; padding: 10px 12px; resize: vertical; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--blue-mid); background: #fff; }
.form-row { display: grid; gap: 14px; }
.form-row-2 { grid-template-columns: 1fr 1fr; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

/* Alerta financeiro */
.alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 10px; }
.alert-warning { background: var(--orange-bg); border: 1px solid #F5C07A; color: var(--orange); }
.alert-danger   { background: var(--red-bg);    border: 1px solid #F5A8A3; color: var(--red); }
.alert-info     { background: var(--blue-pale); border: 1px solid #9DCFEF; color: var(--blue-mid); }
.alert-success  { background: var(--green-bg);  border: 1px solid #9FD9C5; color: var(--green); }
.alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* Drawer */
.drawer-overlay { position: fixed; inset: 0; background: rgba(15,29,53,0.4); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.drawer-overlay.open { opacity: 1; pointer-events: all; }
.drawer { position: fixed; top: 0; right: -700px; width: 680px; max-width: 100vw; height: 100vh; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 201; transition: right 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
.drawer.open { right: 0; }
.drawer-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
.drawer-title { font-size: 16px; font-weight: 700; }
.drawer-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.drawer-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; line-height: 1; padding: 0; }
.drawer-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 24px; flex-shrink: 0; }
.drawer-tab { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.drawer-tab.active { color: var(--blue-mid); border-bottom-color: var(--blue-mid); }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; }

/* Loading */
.loading-overlay { display: flex; align-items: center; justify-content: center; padding: 60px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue-mid); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); text-align: center; }
.empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 13px; max-width: 300px; line-height: 1.5; }

/* Page section */
.page-section { margin-bottom: 24px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }

/* ============================================================
   MOBILE
   ============================================================ */
.mobile-topbar {
  display: none; height: 56px; background: var(--blue-dark);
  align-items: center; justify-content: space-between;
  padding: 0 16px; position: sticky; top: 0; z-index: 100;
}
.mobile-menu-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px; }
.mobile-logo { font-size: 16px; font-weight: 700; color: #fff; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }

@media (max-width: 768px) {
  /* Layout */
  .sidebar { transform: translateX(-100%); }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .main { left: 0 !important; }
  .mobile-topbar { display: flex; }
  .topbar { display: none; }
  .content { padding: 12px; }

  /* Grids */
  .cards-grid-4 { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cards-grid-3 { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cfg-grid-2, .form-row-2, .form-row-3, .grid-2, .grid-3 { grid-template-columns: 1fr; }

  /* Drawer — tela cheia no mobile */
  .drawer { width: 100%; right: -100%; border-radius: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  /* Tabs do drawer — scroll horizontal */
  .drawer-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding: 0 12px; }
  .drawer-tab  { white-space: nowrap; flex-shrink: 0; font-size: 12px; padding: 8px 12px; }
  /* Bloco de ações — botões em grade 2 colunas */
  .acoes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acoes-grid .btn { width: 100%; justify-content: center; font-size: 13px; }
  .drawer-header { padding: 14px 16px; flex-shrink: 0; }
  .drawer-body { padding: 12px 16px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .drawer-footer { padding: 12px 16px; gap: 8px; flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); }
  .drawer-footer .btn { flex: 1; justify-content: center; }

  /* Tabelas — esconde colunas secundárias */
  .data-table { font-size: 12px; }
  .data-table th, .data-table td { padding: 8px 10px; }
  .hide-mobile { display: none !important; }

  /* Cards do catálogo — 2 colunas no mobile */
  .cat-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
  .cat-card { border-radius: 8px; }
  .cat-card-body { padding: 8px; }
  .cat-card-body h3 { font-size: 11px; }
  .cat-card-footer { padding: 6px 8px 8px; }
  .cat-card-footer .btn { font-size: 12px; padding: 6px; }

  /* Topbar mobile */
  .mobile-topbar { height: 52px; padding: 0 14px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
  .drawer-footer { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .mobile-topbar .app-logo { font-size: 15px; }

  /* Pedidos — carrinho mais compacto */
  .ped-etapa { padding: 14px; margin-bottom: 12px; }
  .ped-etapa-header { gap: 8px; margin-bottom: 12px; }
  .ped-etapa-num { width: 28px; height: 28px; font-size: 13px; }
  .ped-etapa-titulo { font-size: 15px; }

  /* Botões no carrinho empilham */
  .ped-acoes { flex-direction: column; }
  .ped-acoes .btn { width: 100%; }

  /* Seção header com botões — empilha no mobile */
  .section-header { flex-wrap: wrap; gap: 8px; }
  .section-header .btn { font-size: 12px; padding: 6px 12px; }

  /* Configurações — tabs scroll horizontal */
  .cfg-abas { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding-bottom: 4px; }
  .cfg-aba { white-space: nowrap; flex-shrink: 0; font-size: 12px; padding: 6px 12px; }

  /* Resumo do pedido */
  .ped-resumo-linha { font-size: 13px; }
  .ped-total { font-size: 18px; }

  /* Form fields — evita zoom iOS */
  .cfg-input, input[type="text"], input[type="number"], input[type="email"],
  input[type="password"], select, textarea {
    font-size: 16px !important;
    min-height: 44px;
  }

  /* Botões maiores para touch */
  .btn { min-height: 40px; }
  .btn-sm { min-height: 34px; }
  .btn-lg { min-height: 52px; font-size: 16px !important; }

  /* Tabela do carrinho do pedido — scroll horizontal */
  .ped-tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Coluna Total C/IPI no carrinho — esconde no mobile */
  .ped-col-ipi { display: none; }

  /* Catálogo topbar — filtros em coluna */
  .cat-filtros-row { flex-direction: column; }
  .cat-search-wrap { width: 100%; }
  .cat-select { width: 100%; }
  .cat-acoes-row { flex-direction: column; gap: 8px; }
  .cat-acoes-row button { width: 100%; justify-content: center; }

  /* Lista de pedidos — esconde colunas no mobile */
  .gped-col-prazo { display: none; }

  /* Drawer footer — botões em coluna no mobile pequeno */
  .drawer-footer { flex-wrap: wrap; }

  /* Badges menores */
  .badge { font-size: 10px; padding: 2px 6px; }

  /* Cards de KPI */
  .card { padding: 12px; }
  .card-value { font-size: 22px; }

  /* Scroll horizontal em tabelas largas */
  .table-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }

// ============================================================

const SUPA_URL = 'https://vishxwdxqiygbxmtpfoy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpc2h4d2R4cWl5Z2J4bXRwZm95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0Njg2MjIsImV4cCI6MjA4ODA0NDYyMn0.J647m3ieDHahNQYBWMRESl0aPFXsT_zt_7ZcDvyB-SA';

let HEADERS = {
  'apikey': SUPA_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let USUARIO = null; // { id, email, nome, perfil: 'representante'|'gestor'|'admin', id_representante }

// ============================================================

// Verifica acesso ao módulo 'atacado' via user_metadata
function temAcessoStonni(meta) {
  // Acesso liberado para qualquer usuário autenticado
  // A restrição real é feita pelo ped_gestores/ped_representantes em carregarUsuario
  return true;
}

async function carregarUsuario(user, token) {
  const meta = user.user_metadata ?? {};
  HEADERS['Authorization'] = `Bearer ${token}`;

  // Perfil inicial pelo metadata (fallback)
  USUARIO = {
    id: user.id,
    email: user.email,
    nome: meta.nome || user.email.split('@')[0],
    perfil: meta.admin ? 'admin' : (meta.perfil || 'representante'),
    // Porteiro do Hub: módulos liberados e flag admin (base da parede "rep não vê CRM")
    modulos: Array.isArray(meta.modulos) ? meta.modulos : [],
    admin: !!meta.admin,
    token
  };

  // ── FONTE DE VERDADE: ped_gestores ──
  // Sempre verifica se o email está em ped_gestores — ignora o metadata do Auth
  // Isso garante que mudanças de perfil feitas no portal funcionem mesmo que
  // outro sistema sobrescreva o metadata do Auth
  try {
    const gestRes = await fetch(
      `${SUPA_URL}/rest/v1/ped_gestores?email=eq.${encodeURIComponent(USUARIO.email)}&ativo=eq.true&select=*&limit=1`,
      { headers: HEADERS }
    );
    const gestores = await gestRes.json();
    if (Array.isArray(gestores) && gestores.length > 0) {
      const g = gestores[0];
      USUARIO.perfil        = g.perfil || 'gestor';
      USUARIO.nome          = g.nome   || USUARIO.nome;
      USUARIO.id_gestor     = g.id;
      USUARIO.pode_aprovar  = g.pode_aprovar;
      USUARIO.pode_reprovar = g.pode_reprovar;
      USUARIO.pode_faturar  = g.pode_faturar;
      USUARIO.pode_catalogo = g.pode_catalogo;
      USUARIO.pode_config   = g.pode_config;
      iniciarApp();
      return;
    }
  } catch(e) {}

  // ── Se não é gestor, verifica representantes ──
  if (USUARIO.perfil === 'representante') {
    try {
      let repRes = await fetch(`${SUPA_URL}/rest/v1/ped_representantes?user_id=eq.${USUARIO.id}&select=*&limit=1`, { headers: HEADERS });
      let reps = await repRes.json();
      if (!Array.isArray(reps) || !reps.length) {
        repRes = await fetch(`${SUPA_URL}/rest/v1/ped_representantes?email=eq.${encodeURIComponent(USUARIO.email)}&select=*&limit=1`, { headers: HEADERS });
        reps = await repRes.json();
        if (Array.isArray(reps) && reps.length > 0) {
          await fetch(`${SUPA_URL}/rest/v1/ped_representantes?id=eq.${reps[0].id}`, {
            method: 'PATCH', headers: { ...HEADERS, 'Prefer': 'return=minimal' },
            body: JSON.stringify({ user_id: USUARIO.id })
          });
        }
      }
      if (Array.isArray(reps) && reps.length > 0) {
        USUARIO.id_representante = reps[0].id;
        USUARIO.nome             = reps[0].nome || USUARIO.nome;
        USUARIO.id_tabela_preco  = reps[0].id_tabela_preco;
      }
    } catch(e) {}
  }

  iniciarApp();
}

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-error');
  erroEl.textContent = '';

  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; return; }

  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if (!data.access_token) {
      erroEl.textContent = 'E-mail ou senha incorretos.';
      return;
    }

    const meta = data.user?.user_metadata ?? {};
    if (!temAcessoStonni(meta)) {
      erroEl.textContent = 'Sem acesso a este sistema. Contate o administrador.';
      return;
    }

    await carregarUsuario(data.user, data.access_token);
  } catch (e) {
    erroEl.textContent = 'Erro de conexão. Tente novamente.';
  }
}

async function fazerLogout() {
  try {
    await fetch(`${SUPA_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': HEADERS['Authorization'] || '' }
    });
  } catch(e) {}
  USUARIO = null;
  HEADERS['Authorization'] = '';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ============================================================
//  NAV — menus por perfil
// ============================================================
let paginaAtual = '';

// ============================================================
//  ACESSO DIRIGIDO PELO HUB (user_metadata.modulos + admin)
//  'stonni'  → portal (catálogo/pedidos)
//  'atacado' → CRM interno (Info Técnica)
//  admin     → Configurações
//  A identidade de negócio (id_representante / tabela de preço / gestor) continua
//  vindo de ped_representantes/ped_gestores — serve só para a lógica de pedidos,
//  não para liberar áreas. Quem libera área é o Hub.
// ============================================================
function temMod(m) { return ((USUARIO && USUARIO.modulos) || []).includes(m); }
function ehInterno() { return temMod('atacado'); }              // vê o CRM
function temPortal() { return temMod('stonni') || temMod('atacado'); }

function construirNav() {
  const grupos = [];

  // PRINCIPAL — portal (catálogo + pedidos). Interno também vê.
  if (temPortal()) {
    const itens = [
      { id: 'catalogo',    icon: '🛍️', label: 'Catálogo',    breadcrumb: 'Portal · Catálogo' },
      { id: 'novo-pedido', icon: '➕', label: 'Novo Pedido',  breadcrumb: 'Portal · Novo Pedido' },
    ];
    // Rep vê só os pedidos dele; interno/gestor/admin vê todos.
    if (ehInterno() || USUARIO.perfil === 'gestor' || USUARIO.admin) {
      itens.push({ id: 'pedidos', icon: '📦', label: 'Pedidos', breadcrumb: 'Portal · Pedidos' });
    } else {
      itens.push({ id: 'meus-pedidos', icon: '📋', label: 'Meus Pedidos', breadcrumb: 'Portal · Meus Pedidos' });
    }
    itens.push({ id: 'materiais', icon: '📚', label: 'Materiais', breadcrumb: 'Portal · Materiais & IA' });
    grupos.push({ grupo: 'PRINCIPAL', itens });
  }

  // INTERNO — CRM / Info Técnica (módulo 'atacado'). Rep nunca vê.
  if (ehInterno()) {
    grupos.push({ grupo: 'INTERNO', itens: [
      { id: 'crm', icon: '📇', label: 'Info Técnica', breadcrumb: 'Interno · Info Técnica' },
    ]});
  }

  // ADMINISTRAÇÃO — só admin do Hub.
  if (USUARIO.admin) {
    grupos.push({ grupo: 'ADMINISTRAÇÃO', itens: [
      { id: 'configuracoes', icon: '⚙️', label: 'Configurações', breadcrumb: 'Admin · Configurações' },
    ]});
  }

  return grupos;
}

function renderNav() {
  const nav = construirNav();
  const el = document.getElementById('sidebar-nav');
  if (!nav.length) {
    el.innerHTML = `<div style="padding:20px;color:rgba(255,255,255,0.6);font-size:12px;line-height:1.5">Sem áreas liberadas para o seu usuário. Fale com o administrador.</div>`;
    return;
  }
  el.innerHTML = nav.map(grupo => `
    <div class="nav-group-label">${grupo.grupo}</div>
    ${grupo.itens.map(item => `
      <div class="nav-item" id="nav-${item.id}" onclick="irPara('${item.id}')" data-breadcrumb="${item.breadcrumb}">
        <span class="nav-icon">${item.icon}</span>
        <span>${item.label}</span>
      </div>
    `).join('')}
  `).join('');
}


// ── Sistema de logs global ──
window.appLog = async function(tipo, descricao, opcoes) {
  const cat = (opcoes||{}).categoria || 'sistema';
  const det = (opcoes||{}).detalhe   || null;
  try {
    const token = window.HEADERS?.['Authorization']?.replace('Bearer ','') || '';

    await fetch(`${SUPA_URL}/rest/v1/app_logs`, {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        SUPA_KEY,
        'Authorization': 'Bearer ' + token,
        'Prefer':        'return=minimal'
      },
      body: JSON.stringify({
        tipo, descricao,
        categoria: cat,
        detalhe: det ? (typeof det==='string' ? det : JSON.stringify(det,null,2)) : null,
        usuario: window.USUARIO?.nome || null
      })
    });
  } catch(e) { /* silencioso */ }
};

function irPara(paginaId, params = {}) {
  // Remove active de todos
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById(`nav-${paginaId}`);
  if (navEl) {
    navEl.classList.add('active');
    const breadcrumb = navEl.dataset.breadcrumb || '';
    const labelEl = navEl.querySelector('span:last-child');
    document.getElementById('topbar-title').textContent = labelEl?.textContent || paginaId;
    document.getElementById('topbar-breadcrumb').textContent = breadcrumb;
  }
  paginaAtual = paginaId;
  fecharSidebar();
  renderPagina(paginaId, params);
}

function fmt(v) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtData(d) { if (!d) return '—'; return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR'); }
function fmtCNPJ(v) { const n = (v||'').replace(/\D/g,''); return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); }

async function supa(tabela, query = '') {
  const res = await fetch(`${SUPA_URL}/rest/v1/${tabela}?${query}&limit=9999`, { headers: HEADERS });
  return res.json();
}
async function supaInsert(tabela, body) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${tabela}`, {
    method: 'POST',
    headers: { ...HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.text().catch(()=>'');
    console.error(`supaInsert ${tabela} erro ${res.status}:`, err);
  }
  return res.json().catch(()=>({}));
}
async function supaPatch(tabela, filtro, body) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${tabela}?${filtro}`, {
    method: 'PATCH',
    headers: { ...HEADERS, 'Prefer': 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.text().catch(()=>'');
    console.error(`supaPatch ${tabela} erro ${res.status}:`, err);
  }
  return res.status;
}

// ============================================================
//  AUTO LOGIN — usa sessão do Supabase Auth (compartilhada com Hub)
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const LS_KEY = 'sb-vishxwdxqiygbxmtpfoy-auth-token';
    const sbToken = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    let accessToken = sbToken.access_token;
    const refreshToken = sbToken.refresh_token;

    if (!accessToken && !refreshToken) throw new Error('sem token');

    // Tenta usar o access_token atual
    if (accessToken) {
      const res = await fetch(`${SUPA_URL}/auth/v1/user`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + accessToken }
      });
      if (res.ok) {
        const userData = await res.json();
        if (userData.id && temAcessoStonni(userData.user_metadata ?? {})) {
          await carregarUsuario(userData, accessToken);
          return;
        }
      }
    }

    // access_token expirado — tenta renovar com refresh_token
    if (refreshToken) {
      const refRes = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      if (refRes.ok) {
        const newSession = await refRes.json();
        if (newSession.access_token) {
          // Salva nova sessão no localStorage
          localStorage.setItem(LS_KEY, JSON.stringify({
            access_token: newSession.access_token,
            refresh_token: newSession.refresh_token || refreshToken,
            expires_at: Math.floor(Date.now()/1000) + (newSession.expires_in || 3600)
          }));
          const userRes = await fetch(`${SUPA_URL}/auth/v1/user`, {
            headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + newSession.access_token }
          });
          if (userRes.ok) {
            const userData = await userRes.json();
            if (userData.id && temAcessoStonni(userData.user_metadata ?? {})) {
              await carregarUsuario(userData, newSession.access_token);
              return;
            }
          }
        }
      }
    }
  } catch(e) {}

  // Sem sessão válida — mostra login
  document.getElementById('login-screen').classList.remove('hidden');
});
