<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stonni — Portal do Representante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Design system Stonni (ferramentas internas) — tokens canonicos.
     O ?v= tem de ser IGUAL ao do SHELL do sw.js: caches.match casa a URL inteira. -->
<link rel="stylesheet" href="ds/stonni-ds.css?v=20260917">
<link rel="stylesheet" href="ds/stonni-icones.css?v=20260915">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<!-- Hex literal de proposito: <meta> e manifest.json nao resolvem var().
     Este valor espelha --action-primary-bg (a cor da topbar mobile). -->
<meta name="theme-color" content="#145EA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stonni">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   PONTE PARA O DESIGN SYSTEM STONNI — ds/stonni-ds.css
   ------------------------------------------------------------
   Os nomes antigos continuam valendo; quem manda no VALOR e o DS.
   E assim que as ~600 marcacoes style= espalhadas pelo JS herdam a
   paleta sem serem reescritas uma a uma.

   TRES pontos que nao sao obvios e nao dao erro nenhum se errados:

   1. --text-muted COLIDE com o DS (la e neutral-600, o cinza do
      meio; aqui sempre foi o mais claro dos tres). Entao ele e
      REDEFINIDO de proposito para --text-subtle. Nao e
      auto-referencia (--x: var(--x)), e estreitamento.

   2. Por causa de (1), --text-secondary NAO pode apontar para
      var(--text-muted): dentro do mesmo :root o var() ja enxerga o
      valor redefinido, e os dois niveis virariam a mesma cor em
      silencio. Por isso ele puxa --neutral-600 da rampa base.

   3. --radius-sm COLIDIA com sentido diferente (8px aqui, 4px no
      DS). Os 141 usos foram migrados para --radius-lg (8px no DS) e
      o nome saiu daqui de vez.

   Herdados do DS sem redeclarar: --shadow-sm/md/lg e --sidebar-w.
   ============================================================ */
:root {
  --bg:             var(--surface-page);
  --surface:        var(--surface-card);
  --surface2:       var(--surface-hover);
  --border:         var(--border-default);

  /* Azuis da marca. Atencao: --blue-dark era acao E cromo de
     navegacao ao mesmo tempo. Aqui ele fica so com a ACAO; a
     sidebar e a topbar mobile passaram a usar --surface-nav. */
  --blue-dark:      var(--action-primary-bg);
  --blue-mid:       var(--blue-500);
  --blue-light:     var(--cyan-500);
  --blue-pale:      var(--blue-50);

  --text-primary:   var(--text-body);
  --text-secondary: var(--neutral-600);
  --text-muted:     var(--text-subtle);

  --green:  var(--success-600);   --green-bg:  var(--success-50);
  --red:    var(--danger-600);    --red-bg:    var(--danger-50);
  --orange: var(--warning-600);   --orange-bg: var(--warning-50);
  --yellow: var(--warning-700);   --yellow-bg: var(--warning-50);

  --radius: var(--radius-xl);

  /* Tokens que so este app tem. O DS nao define versao translucida das
     semanticas, e vidro colorido e usado aqui em aviso, selecao e toast.
     As hues saem do proprio DS — blue-500 26,116,196 · danger-500
     224,49,49 · warning-500 232,137,11 · success-500 22,160,99 · tinta
     12,17,22 — para o veu andar junto se a paleta mudar. */
  --blue-veil:            rgba(26,116,196,.10);
  --blue-veil-strong:     rgba(26,116,196,.25);
  --danger-veil:          rgba(224,49,49,.12);
  --danger-veil-strong:   rgba(224,49,49,.28);
  --warning-veil:         rgba(232,137,11,.12);
  --success-veil:         rgba(22,160,99,.25);
  --on-brand-veil:        rgba(255,255,255,.22);
  --on-brand-veil-border: rgba(255,255,255,.40);
  --shadow-col-sticky:    -6px 0 8px -6px rgba(12,17,22,.18);

  /* MEIO-DEGRAU — tambem so deste app.
     Este app nasceu numa grade de 2px; o DS usa 4px, e a escala de
     corpo dele comeca em 12px. Arredondar os ~490 pontos fora da
     escala para o degrau vizinho mudaria a densidade do app inteiro
     de uma vez — decisao de redesenho, nao de migracao. Entao eles
     viram token aqui: a medida fica centralizada (mexer na densidade
     e mexer NESTE bloco) e a tela nao muda nada hoje.
     Ao redesenhar a densidade, aponte cada um para o degrau vizinho
     do DS (--space-N ou --fs-N) e apague a linha daqui. */
  --space-0-5: 2px;   --space-1-5: 6px;   --space-2-5: 10px;
  --space-3-5: 14px;  --space-4-5: 18px;
  --fs-075: 10px;     --fs-090: 11px;     --fs-450: 16px;
  --fs-550: 18px;     --fs-650: 22px;
  --radius-10: 10px;  --radius-14: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); font-size:var(--fs-300); }

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--gradient-brand);
  z-index: 1000;
}
#login-screen.hidden { display: none; }

.login-box {
  background: var(--surface);
  border-radius:var(--radius-2xl);
  padding:var(--space-10);
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  display: flex; flex-direction: column; align-items: center; margin-bottom:var(--space-8);
}
.login-logo-mark {
  width: 56px; height:56px; border-radius:var(--radius-14);
  background: var(--gradient-brand);
  display: flex; align-items: center; justify-content: center;
  font-size:var(--fs-650); font-weight: 800; color: var(--neutral-0); letter-spacing: -1px;
  margin-bottom:var(--space-3);
}
.login-logo h1 { font-size:var(--fs-650); font-weight: 700; color: var(--blue-dark); letter-spacing: -0.5px; }
.login-logo p { font-size:var(--fs-100); color: var(--text-muted); margin-top:var(--space-0-5); text-transform: uppercase; letter-spacing: 1px; }

.form-group { margin-bottom:var(--space-4); }
.form-group label { display: block; font-size:var(--fs-100); font-weight: 600; color: var(--text-secondary); margin-bottom:var(--space-1-5); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input {
  width: 100%; height:42px; padding:0 var(--space-3-5);
  border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  font-family: var(--font-sans); font-size:var(--fs-300); color: var(--text-primary);
  background: var(--surface2); outline: none; transition: border-color 0.15s;
}
.form-group input:focus { border-color: var(--blue-mid); background: var(--neutral-0); }

.btn-login {
  width: 100%; height:44px; background: var(--blue-dark); color: var(--neutral-0);
  border: none; border-radius: var(--radius-lg); font-family: var(--font-sans);
  font-size:var(--fs-300); font-weight: 600; cursor: pointer; transition: background 0.15s;
  margin-top:var(--space-2);
}
.btn-login:hover { background: var(--blue-mid); }
.login-error { font-size:var(--fs-100); color: var(--red); text-align: center; margin-top:var(--space-2-5); min-height:16px; }

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display: none; }
#app.visible { display: block; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w); background: var(--surface-nav);
  position: fixed; left: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column; z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar-logo {
  padding:var(--space-5) var(--space-5) var(--space-4);
  border-bottom: 1px solid var(--border-nav);
}
.sidebar-logo-inner {
  display: flex; align-items: center; gap:var(--space-2-5);
}
.sidebar-logo-mark {
  width: 36px; height:36px; border-radius:var(--radius-10);
  background: var(--blue-light);
  display: flex; align-items: center; justify-content: center;
  font-size:var(--fs-300); font-weight: 800; color: var(--neutral-0); flex-shrink: 0;
}
.sidebar-logo-text { flex: 1; overflow: hidden; }
.sidebar-logo-text h2 { font-size:var(--fs-400); font-weight: 700; color: var(--neutral-0); letter-spacing: -0.3px; }
.sidebar-logo-text span { font-size:var(--fs-075); color: var(--text-on-nav-muted); text-transform: uppercase; letter-spacing: 1px; }

.sidebar-nav { flex: 1; overflow-y: auto; padding:var(--space-3) 0; }
.nav-group-label {
  font-size:var(--fs-075); font-weight: 600; letter-spacing: 0.8px;
  color: var(--text-on-nav-muted); text-transform: uppercase;
  padding:var(--space-3) var(--space-5) var(--space-1-5); margin-top:var(--space-1);
}
.nav-item {
  display: flex; align-items: center; gap:var(--space-2-5);
  padding:9px var(--space-5); cursor: pointer;
  color: var(--text-on-nav-muted); font-size:var(--fs-200); font-weight: 500;
  transition: all 0.15s; border-radius: 0; position: relative;
  text-decoration: none;
}
.nav-item:hover { color: var(--text-on-nav); background: var(--surface-nav-hover); }
.nav-item.active { color: var(--blue-light); background: var(--surface-nav-active); }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--blue-light); border-radius:0 2px 2px 0;
}
.nav-item .nav-icon { font-size:var(--fs-450); width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size:var(--fs-075); font-weight: 700;
  padding:1px var(--space-1-5); border-radius:var(--radius-10);
  background: var(--red); color: var(--neutral-0);
}

.sidebar-footer {
  padding:var(--space-4) var(--space-5);
  border-top: 1px solid var(--border-nav);
}
.user-info { display: flex; align-items: center; gap:var(--space-2-5); cursor: pointer; }
.user-avatar {
  width: 32px; height:var(--control-h-sm); border-radius:var(--radius-lg);
  background: var(--surface-nav-active);
  display: flex; align-items: center; justify-content: center;
  font-size:var(--fs-200); font-weight: 700; color: var(--neutral-0); flex-shrink: 0;
}
.user-name { font-size:var(--fs-100); font-weight: 600; color: var(--text-on-nav); }
.user-role { font-size:var(--fs-075); color: var(--text-on-nav-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.btn-logout {
  margin-top:var(--space-3); width: 100%; padding:var(--space-2);
  background: var(--surface-nav-hover); border: 1px solid var(--border-nav);
  border-radius: var(--radius-lg); color: var(--text-on-nav-muted);
  font-size:var(--fs-100); font-family: var(--font-sans); cursor: pointer;
  transition: all 0.15s;
}
.btn-logout:hover { background: var(--surface-nav-active); color: var(--text-on-nav); }

/* MAIN */
.main {
  position: fixed; left: var(--sidebar-w); right: 0; top: 0; bottom: 0;
  overflow-y: auto; display: flex; flex-direction: column;
}

/* TOPBAR */
.topbar {
  height:60px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding:0 var(--space-6); flex-shrink: 0; position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow-sm);
}
.topbar-left {}
.topbar-title { font-size:var(--fs-400); font-weight: 600; color: var(--text-primary); }
.topbar-breadcrumb { font-size:var(--fs-090); color: var(--text-muted); margin-top:1px; }
.topbar-right { display: flex; align-items: center; gap:var(--space-2-5); }

/* CONTENT */
.content { padding:var(--space-5) var(--space-6) var(--space-8); flex: 1; }

/* ============================================================
   COMPONENTES COMUNS
   ============================================================ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding:var(--space-4-5) var(--space-5); box-shadow: var(--shadow-sm);
}
.card-label { font-size:var(--fs-090); font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom:var(--space-2); }
.card-value { font-size:26px; font-weight: 700; font-family: var(--font-mono); letter-spacing: -0.5px; }
.card-value.green { color: var(--green); }
.card-value.red   { color: var(--red); }
.card-value.blue  { color: var(--blue-mid); }
.card-value.orange{ color: var(--orange); }
.card-sub { font-size:var(--fs-100); color: var(--text-muted); margin-top:var(--space-1); }
.cards-grid { display: grid; gap:var(--space-3-5); }
.cards-grid-4 { grid-template-columns: repeat(4, 1fr); }
.cards-grid-3 { grid-template-columns: repeat(3, 1fr); }
.cards-grid-2 { grid-template-columns: repeat(2, 1fr); }

.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-card-header { padding:var(--space-3-5) var(--space-5); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.table-card-title { font-size:var(--fs-200); font-weight: 600; }
.data-table { width: 100%; border-collapse: collapse; font-size:var(--fs-200); }
.data-table th { padding:var(--space-2-5) var(--space-4); font-size:var(--fs-090); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); background: var(--surface2); border-bottom: 1px solid var(--border); }
.data-table td { padding:11px var(--space-4); border-bottom: 1px solid var(--border); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--surface2); }
.data-table td.right { text-align: right; }
.data-table td.mono { font-family: var(--font-mono); font-size: 12.5px; }
.data-table tr.clickable { cursor: pointer; }

.badge { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; padding:var(--space-0-5) var(--space-2); border-radius:var(--radius-sm); letter-spacing: 0.5px; text-transform: uppercase; }
.badge-rascunho  { background: var(--surface2);    color: var(--text-muted); }
.badge-enviado   { background: var(--blue-pale);   color: var(--blue-mid); }
.badge-aprovado  { background: var(--green-bg);    color: var(--green); }
.badge-reprovado { background: var(--red-bg);      color: var(--red); }
.badge-faturado  { background: var(--indigo-50);             color: var(--indigo-500); }
.badge-cancelado { background: var(--surface2);    color: var(--text-muted); }
  .badge-cotacao  { background: var(--indigo-50); color: var(--indigo-500); border: 1px solid var(--indigo-100); }
  .badge-warning  { background: var(--warning-50); color: var(--warning-700); border: 1px solid var(--warning-100); }
  .badge-faturado { background: var(--blue-50); color: var(--blue-600); border: 1px solid var(--blue-100); }
.badge-esgotado  { background: var(--red-bg);      color: var(--red); }
.badge-disponivel{ background: var(--green-bg);    color: var(--green); }

.btn { height:34px; padding:0 var(--space-3-5); border: none; border-radius: var(--radius-lg); font-family: var(--font-sans); font-size:var(--fs-200); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap:var(--space-1-5); transition: all 0.15s; }
.btn-primary { background: var(--blue-dark); color: var(--neutral-0); }
.btn-primary:hover { background: var(--blue-mid); }
.btn-success { background: var(--green); color: var(--neutral-0); }
.btn-success:hover { filter: brightness(1.1); }
.btn-danger { background: var(--red); color: var(--neutral-0); }
.btn-danger:hover { filter: brightness(1.1); }
.btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--surface2); }
.btn-sm { height:28px; padding:0 var(--space-2-5); font-size:var(--fs-100); }
.btn-lg { height:42px; padding:0 var(--space-5); font-size:var(--fs-300); }

.toggle-group { display: flex; gap:var(--space-1); }
.toggle-btn { padding:var(--space-1) var(--space-2-5); border-radius:var(--radius-md); border: 1px solid var(--border); background: transparent; font-size:var(--fs-100); font-weight: 500; color: var(--text-secondary); cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; }
.toggle-btn.active { background: var(--blue-dark); border-color: var(--blue-dark); color: var(--neutral-0); }

.form-field { margin-bottom:var(--space-4); }
.form-field label { display: block; font-size:var(--fs-100); font-weight: 600; color: var(--text-secondary); margin-bottom:var(--space-1-5); text-transform: uppercase; letter-spacing: 0.5px; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; height:38px; padding:0 var(--space-3);
  border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  font-family: var(--font-sans); font-size:var(--fs-200); color: var(--text-primary);
  background: var(--surface2); outline: none; transition: border-color 0.15s;
}
.form-field textarea { height: auto; padding:var(--space-2-5) var(--space-3); resize: vertical; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--blue-mid); background: var(--neutral-0); }
.form-row { display: grid; gap:var(--space-3-5); }
.form-row-2 { grid-template-columns: 1fr 1fr; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

/* Alerta financeiro */
.alert { padding:var(--space-3) var(--space-4); border-radius: var(--radius-lg); font-size:var(--fs-200); margin-bottom:var(--space-3-5); display: flex; align-items: flex-start; gap:var(--space-2-5); }
.alert-warning { background: var(--orange-bg); border: 1px solid var(--warning-100); color: var(--orange); }
.alert-danger   { background: var(--red-bg);    border: 1px solid var(--danger-100); color: var(--red); }
.alert-info     { background: var(--blue-pale); border: 1px solid var(--blue-200); color: var(--blue-mid); }
.alert-success  { background: var(--green-bg);  border: 1px solid var(--success-100); color: var(--green); }
.alert-icon { font-size:var(--fs-450); flex-shrink: 0; margin-top:1px; }

/* Drawer */
.drawer-overlay { position: fixed; inset: 0; background: var(--surface-overlay); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.drawer-overlay.open { opacity: 1; pointer-events: all; }
.drawer { position: fixed; top: 0; right: -700px; width: 680px; max-width: 100vw; height: 100vh; background: var(--surface); box-shadow: var(--shadow-lg); z-index: 201; transition: right 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
.drawer.open { right: 0; }
.drawer-header { padding:var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
.drawer-title { font-size:var(--fs-450); font-weight: 700; }
.drawer-sub { font-size:var(--fs-100); color: var(--text-muted); margin-top:3px; }
.drawer-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size:var(--fs-600); line-height: 1; padding: 0; }
.drawer-tabs { display: flex; border-bottom: 1px solid var(--border); padding:0 var(--space-6); flex-shrink: 0; }
.drawer-tab { padding:var(--space-2-5) var(--space-4); font-size:var(--fs-200); font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.drawer-tab.active { color: var(--blue-mid); border-bottom-color: var(--blue-mid); }
.drawer-body { flex: 1; overflow-y: auto; padding:var(--space-6); }
.drawer-footer { padding:var(--space-4) var(--space-6); border-top: 1px solid var(--border); display: flex; gap:var(--space-2-5); justify-content: flex-end; flex-shrink: 0; }

/* Loading */
.loading-overlay { display: flex; align-items: center; justify-content: center; padding:60px; }
.spinner { width: 32px; height:var(--control-h-sm); border: 3px solid var(--border); border-top-color: var(--blue-mid); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding:60px var(--space-5); color: var(--text-muted); text-align: center; }
.empty-state-icon { font-size:40px; margin-bottom:var(--space-3); opacity: 0.5; }
.empty-state h3 { font-size:var(--fs-400); font-weight: 600; color: var(--text-secondary); margin-bottom:var(--space-1-5); }
.empty-state p { font-size:var(--fs-200); max-width: 300px; line-height: 1.5; }

/* Page section */
.page-section { margin-bottom:var(--space-6); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom:var(--space-3-5); }
.section-title { font-size:var(--fs-200); font-weight: 600; color: var(--text-primary); }

/* ============================================================
   MOBILE
   ============================================================ */
.mobile-topbar {
  display: none; height:56px; background: var(--surface-nav);
  align-items: center; justify-content: space-between;
  padding:0 var(--space-4); position: sticky; top: 0; z-index: 100;
}
.mobile-menu-btn { background: none; border: none; color: var(--neutral-0); font-size:var(--fs-650); cursor: pointer; padding:var(--space-1); }
.mobile-logo { font-size:var(--fs-450); font-weight: 700; color: var(--neutral-0); }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: var(--surface-overlay); z-index: 99; }

@media (max-width: 768px) {
  /* Layout */
  .sidebar { transform: translateX(-100%); }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .main { left: 0 !important; }
  .mobile-topbar { display: flex; }
  .topbar { display: none; }
  .content { padding:var(--space-3); }

  /* Grids */
  .cards-grid-4 { grid-template-columns: repeat(2, 1fr); gap:var(--space-2); }
  .cards-grid-3 { grid-template-columns: repeat(2, 1fr); gap:var(--space-2); }
  .cfg-grid-2, .form-row-2, .form-row-3, .grid-2, .grid-3 { grid-template-columns: 1fr; }

  /* Drawer — tela cheia no mobile */
  /* Mobile: desliza por transform (o right/percentual não estava aplicando nesse motor) */
  .drawer { width: 100%; right: 0; left: auto; transform: translateX(100%); border-radius: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); }
  .drawer.open { transform: translateX(0) !important; }
  /* Tabs do drawer — scroll horizontal */
  .drawer-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding:0 var(--space-3); }
  .drawer-tab  { white-space: nowrap; flex-shrink: 0; font-size:var(--fs-100); padding:var(--space-2) var(--space-3); }
  /* Bloco de ações — botões em grade 2 colunas */
  .acoes-grid { display: grid; grid-template-columns: 1fr 1fr; gap:var(--space-2); }
  .acoes-grid .btn { width: 100%; justify-content: center; font-size:var(--fs-200); }
  .drawer-header { padding:var(--space-3-5) var(--space-4); flex-shrink: 0; }
  .drawer-body { padding:var(--space-3) var(--space-4); flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .drawer-footer { padding:var(--space-3) var(--space-4); gap:var(--space-2); flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); }
  .drawer-footer .btn { flex: 1; justify-content: center; }

  /* Tabelas — esconde colunas secundárias */
  .data-table { font-size:var(--fs-100); }
  .data-table th, .data-table td { padding:var(--space-2) var(--space-2-5); }
  .hide-mobile { display: none !important; }

  /* Cards do catálogo — 2 colunas no mobile */
  .cat-grid { grid-template-columns: repeat(2, 1fr) !important; gap:var(--space-2) !important; }
  .cat-card { border-radius:var(--radius-lg); }
  .cat-card-body { padding:var(--space-2); }
  .cat-card-body h3 { font-size:var(--fs-090); }
  .cat-card-footer { padding:var(--space-1-5) var(--space-2) var(--space-2); }
  .cat-card-footer .btn { font-size:var(--fs-100); padding:var(--space-1-5); }

  /* Topbar mobile — respeita o notch do iOS (safe-area-inset-top) p/ o <i class="ic ic-sm" data-ic="menu"></i> não ficar sob a status bar */
  .mobile-topbar { height:calc(52px + env(safe-area-inset-top)); padding:0 var(--space-3-5); padding-top: env(safe-area-inset-top); padding-left:max(var(--space-3-5), env(safe-area-inset-left)); padding-right:max(var(--space-3-5), env(safe-area-inset-right)); }
  .drawer-footer { padding-bottom:max(var(--space-3), env(safe-area-inset-bottom)); }
  .mobile-topbar .app-logo { font-size:var(--fs-400); }

  /* Pedidos — carrinho mais compacto */
  .ped-etapa { padding:var(--space-3-5); margin-bottom:var(--space-3); }
  .ped-etapa-header { gap:var(--space-2); margin-bottom:var(--space-3); }
  .ped-etapa-num { width: 28px; height:28px; font-size:var(--fs-200); }
  .ped-etapa-titulo { font-size:var(--fs-400); }

  /* Botões no carrinho empilham */
  .ped-acoes { flex-direction: column; }
  .ped-acoes .btn { width: 100%; }

  /* Seção header com botões — empilha no mobile */
  .section-header { flex-wrap: wrap; gap:var(--space-2); }
  .section-header .btn { font-size:var(--fs-100); padding:var(--space-1-5) var(--space-3); }

  /* Configurações — tabs scroll horizontal */
  .cfg-abas { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; padding-bottom:var(--space-1); }
  .cfg-aba { white-space: nowrap; flex-shrink: 0; font-size:var(--fs-100); padding:var(--space-1-5) var(--space-3); }

  /* Resumo do pedido */
  .ped-resumo-linha { font-size:var(--fs-200); }
  .ped-total { font-size:var(--fs-550); }

  /* Form fields — evita zoom iOS */
  .cfg-input, input[type="text"], input[type="number"], input[type="email"],
  input[type="password"], select, textarea {
    font-size:var(--fs-450) !important;
    min-height:44px;
  }

  /* Botões maiores para touch */
  .btn { min-height:var(--control-h-md); }
  .btn-sm { min-height:34px; }
  .btn-lg { min-height:52px; font-size:var(--fs-450) !important; }

  /* Tabela do carrinho do pedido — scroll horizontal */
  .ped-tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Coluna Total C/IPI no carrinho — esconde no mobile */
  .ped-col-ipi { display: none; }

  /* Catálogo topbar — filtros em coluna */
  .cat-filtros-row { flex-direction: column; }
  .cat-search-wrap { width: 100%; }
  .cat-select { width: 100%; }
  .cat-acoes-row { flex-direction: column; gap:var(--space-2); }
  .cat-acoes-row button { width: 100%; justify-content: center; }

  /* Lista de pedidos — esconde colunas no mobile */
  .gped-col-prazo { display: none; }

  /* Drawer footer — botões em coluna no mobile pequeno */
  .drawer-footer { flex-wrap: wrap; }

  /* Badges menores */
  .badge { font-size:var(--fs-075); padding:var(--space-0-5) var(--space-1-5); }

  /* Cards de KPI */
  .card { padding:var(--space-3); }
  .card-value { font-size:var(--fs-650); }

  /* Scroll horizontal em tabelas largas */
  .table-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

/* Extra small — celulares menores */
@media (max-width: 390px) {
  .cards-grid-4, .cards-grid-3 { grid-template-columns: 1fr 1fr; }
  .cat-grid { grid-template-columns: 1fr 1fr !important; }
  .content { padding:var(--space-2); }
}

/* ============================================================
   PÁGINAS — placeholder (conteúdo gerado por JS)

/* ============================================================
   TAMANHO DE ICONE POR CONTEXTO
   O .ic-sm da conversao e 16px, que e o certo em texto e botao. Onde
   o slot ja tinha tamanho proprio (nav, estado vazio, alerta), quem
   manda e o contexto — senao o icone entra minusculo no lugar de um
   emoji que era grande.
   ============================================================ */
.nav-icon .ic        { width: 20px; height:20px; }   /* DS: 20 em navegacao lateral */
.alert-icon .ic      { width: 18px; height:18px; }
.empty-state-icon .ic{ width: 40px; height:var(--control-h-md); }
.card-label .ic      { width: 14px; height:14px; }

/* ============================================================
   ANEL DE FOCO (DS)
   Fica no FIM do bloco de proposito: os campos do app zeram o
   outline (`outline: none`) com a mesma especificidade desta regra
   — quem vem depois ganha. Mover isto para cima apaga o foco de
   volta, sem erro nenhum no console.
   :focus-visible, nao :focus, para nao piscar em clique de mouse.
   ============================================================ */
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

<script>
// ============================================================
//  SUPABASE CONFIG
// ============================================================
const SUPA_URL = 'https://vishxwdxqiygbxmtpfoy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpc2h4d2R4cWl5Z2J4bXRwZm95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0Njg2MjIsImV4cCI6MjA4ODA0NDYyMn0.J647m3ieDHahNQYBWMRESl0aPFXsT_zt_7ZcDvyB-SA';
const BLING_FN = `${SUPA_URL}/functions/v1/bling-proxy`;

let HEADERS = {
  'apikey': SUPA_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let USUARIO = null; // { id, email, nome, perfil: 'representante'|'gestor'|'admin', id_representante }

// ============================================================
//  AUTH — integrado com Hub Bononi (Supabase Auth compartilhado)
// ============================================================

// ── A PORTA DESTE APP ───────────────────────────────────────────────────
// Esta lista é a porta E a soma das áreas que existem aqui dentro: `stonni`
// abre o portal, `atacado` abre o CRM interno, e `admin` abre Configurações.
// As duas coisas saem da MESMA lista de propósito. A porta já foi
// `return true` com um comentário dizendo que ped_gestores restringia — e
// ped_gestores nunca recusou ninguém: `carregarUsuario` não tem caminho de
// recusa, quem não é gestor nem representante cai no `iniciarApp()` igual.
// Como o Auth é compartilhado pelos 22 apps do grupo, na prática os 53
// usuários entravam aqui (16/09/2026), inclusive compras e rede autorizada.
const MODULOS_DESTE_APP = ['stonni', 'atacado'];
const MSG_SEM_ACESSO = 'Sem acesso a este sistema. Contate o administrador.';

// Recusar na porta não tira área de ninguém: sem um desses módulos o nav sai
// vazio ("Sem áreas liberadas para o seu usuário"). Troca uma tela em branco
// por um motivo — e para de entregar token a quem não tem o que fazer aqui.
function liberaAlgumaArea(mods, adm, lista) {
  return !!adm || (Array.isArray(mods) && lista.some(m => mods.includes(m)));
}

function temAcessoStonni(meta) {
  meta = meta || {};
  return liberaAlgumaArea(meta.modulos, meta.admin, MODULOS_DESTE_APP);
}

async function carregarUsuario(user, token) {
  const meta = user.user_metadata ?? {};
  HEADERS['Authorization'] = `Bearer ${token}`;

  // Perfil inicial pelo metadata (fallback)
  USUARIO = {
    id: user.id,
    email: user.email,
    nome: meta.nome || user.email.split('@')[0],
    perfil: meta.admin ? 'admin' : (meta.perfil || 'representante'),
    // Porteiro do Hub: módulos liberados e flag admin (base da parede "rep não vê CRM")
    modulos: Array.isArray(meta.modulos) ? meta.modulos : [],
    admin: !!meta.admin,
    token
  };

  // ── FONTE DE VERDADE: ped_gestores ──
  // Sempre verifica se o email está em ped_gestores — ignora o metadata do Auth
  // Isso garante que mudanças de perfil feitas no portal funcionem mesmo que
  // outro sistema sobrescreva o metadata do Auth
  try {
    const gestRes = await fetch(
      `${SUPA_URL}/rest/v1/ped_gestores?email=eq.${encodeURIComponent(USUARIO.email)}&ativo=eq.true&select=*&limit=1`,
      { headers: HEADERS }
    );
    const gestores = await gestRes.json();
    if (Array.isArray(gestores) && gestores.length > 0) {
      const g = gestores[0];
      USUARIO.perfil        = g.perfil || 'gestor';
      USUARIO.nome          = g.nome   || USUARIO.nome;
      USUARIO.id_gestor     = g.id;
      USUARIO.pode_aprovar  = g.pode_aprovar;
      USUARIO.pode_reprovar = g.pode_reprovar;
      USUARIO.pode_faturar  = g.pode_faturar;
      USUARIO.pode_catalogo = g.pode_catalogo;
      USUARIO.pode_config   = g.pode_config;
      iniciarApp();
      return;
    }
  } catch(e) {}

  // ── Se não é gestor, verifica representantes ──
  if (USUARIO.perfil === 'representante') {
    try {
      let repRes = await fetch(`${SUPA_URL}/rest/v1/ped_representantes?user_id=eq.${USUARIO.id}&select=*&limit=1`, { headers: HEADERS });
      let reps = await repRes.json();
      if (!Array.isArray(reps) || !reps.length) {
        repRes = await fetch(`${SUPA_URL}/rest/v1/ped_representantes?email=eq.${encodeURIComponent(USUARIO.email)}&select=*&limit=1`, { headers: HEADERS });
        reps = await repRes.json();
        if (Array.isArray(reps) && reps.length > 0) {
          await fetch(`${SUPA_URL}/rest/v1/ped_representantes?id=eq.${reps[0].id}`, {
            method: 'PATCH', headers: { ...HEADERS, 'Prefer': 'return=minimal' },
            body: JSON.stringify({ user_id: USUARIO.id })
          });
        }
      }
      if (Array.isArray(reps) && reps.length > 0) {
        USUARIO.id_representante = reps[0].id;
        USUARIO.nome             = reps[0].nome || USUARIO.nome;
        USUARIO.id_tabela_preco  = reps[0].id_tabela_preco;
      }
    } catch(e) {}
  }

  iniciarApp();
}

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-error');
  erroEl.textContent = '';

  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; return; }

  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if (!data.access_token) {
      erroEl.textContent = 'E-mail ou senha incorretos.';
      return;
    }

    const meta = data.user?.user_metadata ?? {};
    if (!temAcessoStonni(meta)) {
      erroEl.textContent = MSG_SEM_ACESSO;
      return;
    }

    // Persiste a sessão no formato do supabase-js. Isso: (1) mantém o login após
    // reload; (2) dá SSO para o CRM embutido (crm/ usa supabase-js e lê esta chave).
    try {
      localStorage.setItem('sb-vishxwdxqiygbxmtpfoy-auth-token', JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
        expires_in: data.expires_in || 3600,
        token_type: data.token_type || 'bearer',
        user: data.user
      }));
    } catch (e) {}

    await carregarUsuario(data.user, data.access_token);
  } catch (e) {
    erroEl.textContent = 'Erro de conexão. Tente novamente.';
  }
}

async function fazerLogout() {
  try {
    await fetch(`${SUPA_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': HEADERS['Authorization'] || '' }
    });
  } catch(e) {}
  USUARIO = null;
  HEADERS['Authorization'] = '';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ============================================================
//  NAV — menus por perfil
// ============================================================
let paginaAtual = '';

// ============================================================
//  ACESSO DIRIGIDO PELO HUB (user_metadata.modulos + admin)
//  'stonni'  → portal (catálogo/pedidos)
//  'atacado' → CRM interno (Info Técnica)
//  admin     → Configurações
//  A identidade de negócio (id_representante / tabela de preço / gestor) continua
//  vindo de ped_representantes/ped_gestores — serve só para a lógica de pedidos,
//  não para liberar áreas. Quem libera área é o Hub.
// ============================================================
function temMod(m) { return ((USUARIO && USUARIO.modulos) || []).includes(m); }
function ehAdmin() { return !!(USUARIO && USUARIO.admin); }
// Mesma função da porta (`liberaAlgumaArea`), com a lista de cada área. É o
// que impede porta e nav de voltarem a discordar: área nova aqui só existe se
// o módulo dela entrar em MODULOS_DESTE_APP, que é o que a porta confere.
function ehInterno() { return liberaAlgumaArea(USUARIO && USUARIO.modulos, USUARIO && USUARIO.admin, ['atacado']); }
function temPortal() { return liberaAlgumaArea(USUARIO && USUARIO.modulos, USUARIO && USUARIO.admin, MODULOS_DESTE_APP); }

function construirNav() {
  const grupos = [];

  // PRINCIPAL — portal (catálogo + pedidos). Interno também vê.
  if (temPortal()) {
    const itens = [
      { id: 'catalogo',    icon: '<i class="ic ic-sm" data-ic="shopping-bag"></i>', label: 'Catálogo',    breadcrumb: 'Portal · Catálogo' },
      { id: 'novo-pedido', icon: '<i class="ic ic-sm" data-ic="plus"></i>', label: 'Novo Pedido',  breadcrumb: 'Portal · Novo Pedido' },
    ];
    // Rep vê só os pedidos dele; interno/gestor/admin vê todos.
    if (ehInterno() || USUARIO.perfil === 'gestor' || USUARIO.admin) {
      itens.push({ id: 'pedidos', icon: '<i class="ic ic-sm" data-ic="package"></i>', label: 'Pedidos', breadcrumb: 'Portal · Pedidos' });
    } else {
      itens.push({ id: 'meus-pedidos', icon: '<i class="ic ic-sm" data-ic="clipboard-list"></i>', label: 'Meus Pedidos', breadcrumb: 'Portal · Meus Pedidos' });
    }
    itens.push({ id: 'materiais', icon: '<i class="ic ic-sm" data-ic="book-open"></i>', label: 'Materiais', breadcrumb: 'Portal · Materiais & IA' });
    grupos.push({ grupo: 'PRINCIPAL', itens });
  }

  // INTERNO — seções do CRM na MESMA sidebar, agrupadas como no CRM original. Rep nunca vê.
  if (ehInterno()) {
    grupos.push({ grupo: 'DASHBOARD', itens: [
      { id: 'it-home',       icon: '<i class="ic ic-sm" data-ic="home"></i>', label: 'Home',       breadcrumb: 'Interno · Home' },
      { id: 'it-vendedores', icon: '<i class="ic ic-sm" data-ic="user"></i>', label: 'Vendedores', breadcrumb: 'Interno · Vendedores' },
      { id: 'it-produtos',   icon: '<i class="ic ic-sm" data-ic="bar-chart"></i>', label: 'Produtos',   breadcrumb: 'Interno · Produtos' },
    ]});
    grupos.push({ grupo: 'OPERACIONAL', itens: [
      { id: 'it-crm',        icon: '<i class="ic ic-sm" data-ic="clipboard-list"></i>', label: 'CRM',        breadcrumb: 'Interno · CRM' },
      { id: 'it-prospeccao', icon: '<i class="ic ic-sm" data-ic="target"></i>', label: 'Prospecção', breadcrumb: 'Interno · Prospecção' },
    ]});
  }

  // ADMINISTRAÇÃO — só admin do Hub.
  if (USUARIO.admin) {
    grupos.push({ grupo: 'ADMINISTRAÇÃO', itens: [

// ── Sistema de logs global ──
window.appLog = async function(tipo, descricao, opcoes) {
  const cat = (opcoes||{}).categoria || 'sistema';
  const det = (opcoes||{}).detalhe   || null;
  try {
    const token = window.HEADERS?.['Authorization']?.replace('Bearer ','') || '';
    if (!token) return; // sem token não loga
    await fetch(`${SUPA_URL}/rest/v1/app_logs`, {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        SUPA_KEY,
        'Authorization': 'Bearer ' + token,
        'Prefer':        'return=minimal'
      },
      body: JSON.stringify({
        tipo, descricao,
        categoria: cat,
        detalhe: det ? (typeof det==='string' ? det : JSON.stringify(det,null,2)) : null,
        usuario: window.USUARIO?.nome || null
      })
    });
  } catch(e) { /* silencioso */ }
};

function irPara(paginaId, params = {}) {
  // Remove active de todos
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById(`nav-${paginaId}`);
  if (navEl) {
    navEl.classList.add('active');
    const breadcrumb = navEl.dataset.breadcrumb || '';
    const labelEl = navEl.querySelector('span:last-child');
    document.getElementById('topbar-title').textContent = labelEl?.textContent || paginaId;
    document.getElementById('topbar-breadcrumb').textContent = breadcrumb;
  }
  paginaAtual = paginaId;
  fecharSidebar();
  renderPagina(paginaId, params);
}

// Seções internas → telas do CRM dentro do iframe (mesma sidebar)
const CRM_TABS = { 'it-home':'home', 'it-vendedores':'vendedores', 'it-produtos':'linhas', 'it-crm':'crm', 'it-prospeccao':'prospeccao' };

function renderPagina(id, params) {
  const el = document.getElementById('page-content');

  // Seção interna: reaproveita o MESMO iframe do CRM (troca de tela sem recarregar)
  if (CRM_TABS[id]) {
    const ifr = document.getElementById('crm-frame');
    if (ifr && el.contains(ifr)) { if (window.crmGoto) window.crmGoto(CRM_TABS[id]); return; }
    el.style.padding = '0';
    el.innerHTML = '';
    if (window.renderCRM) window.renderCRM(el, { tab: CRM_TABS[id] });
    return;
  }

  el.style.padding = ''; // restaura o padding padrão (o CRM zera p/ o iframe ocupar tudo)
  el.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

  switch (id) {
    case 'catalogo':       renderCatalogo(el, params); break;
    case 'novo-pedido':    renderNovoPedido(el, params); break;
    case 'meus-pedidos':   renderMeusPedidos(el, params); break;
    case 'pedidos':        renderPedidos(el, params); break;
    case 'materiais':      renderMateriais(el, params); break;
    case 'crm':            renderCRM(el, params); break;
    case 'configuracoes':  renderConfiguracoes(el, params); break;
    case 'representantes': renderConfiguracoes(el, params); break;
    default: el.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><i class="ic ic-sm" data-ic="alert-triangle"></i></div><h3>Em construção</h3><p>Módulo "${id}" em desenvolvimento.</p></div>`;
  }
}

function fmt(v) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtData(d) { if (!d) return '—'; return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR'); }
function fmtCNPJ(v) { const n = (v||'').replace(/\D/g,''); return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5'); }

// Renova o access_token via refresh_token (Supabase Auth). Atualiza localStorage
// + HEADERS. Uma única renovação em voo por vez (evita várias em paralelo).
// Sem isso, o token expirava (~1h) e TODA chamada supa* tomava 401 em silêncio
// (a tela ficava "vazia" sem avisar — foi o caso do Materiais mostrando 0).
let _renovandoToken = null;
async function renovarToken() {
  if (_renovandoToken) return _renovandoToken;
  _renovandoToken = (async () => {
    try {
      const LS_KEY = 'sb-vishxwdxqiygbxmtpfoy-auth-token';
      const sb = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (!sb.refresh_token) return false;
      const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: sb.refresh_token })
      });
      if (!r.ok) return false;
      const ns = await r.json();
      if (!ns.access_token) return false;
      localStorage.setItem(LS_KEY, JSON.stringify({
        access_token: ns.access_token,
        refresh_token: ns.refresh_token || sb.refresh_token,
        expires_at: Math.floor(Date.now()/1000) + (ns.expires_in || 3600)
      }));
      HEADERS['Authorization'] = 'Bearer ' + ns.access_token;
      return true;
    } catch (e) { return false; }
  })();
  try { return await _renovandoToken; } finally { _renovandoToken = null; }
}

async function supa(tabela, query = '') {
  const url = `${SUPA_URL}/rest/v1/${tabela}?${query}&limit=9999`;
  let res = await fetch(url, { headers: HEADERS });
  if (res.status === 401 && await renovarToken()) {
    res = await fetch(url, { headers: HEADERS }); // token renovado — repete 1x
  }
  return res.json();
}
// Foto do catálogo: usa SEMPRE a foto cheia e pede ao Supabase uma versão
// reduzida e nítida na hora (nunca depende da miniatura pré-gerada, que ficava
// velha/quebrada). w = largura desejada em px.
function catFotoUrl(p, w = 500, q = 80) {
  const cheia = (p && (p.fotos_exibir || p.fotos) || [])[0] || null;
  if (!cheia) return null;
  // Só reescreve URLs de storage público do próprio Supabase.
  if (cheia.includes('/storage/v1/object/public/')) {
    const alvo = cheia.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/');
    return `${alvo}?width=${w}&quality=${q}`;
  }
  return cheia;
}
async function supaInsert(tabela, body) {
  const url = `${SUPA_URL}/rest/v1/${tabela}`;
  const opts = { method: 'POST', headers: { ...HEADERS, 'Prefer': 'return=representation' }, body: JSON.stringify(body) };
  let res = await fetch(url, opts);
  if (res.status === 401 && await renovarToken()) {
    res = await fetch(url, { ...opts, headers: { ...HEADERS, 'Prefer': 'return=representation' } });
  }
  if (!res.ok) {
    const err = await res.text().catch(()=>'');
    console.error(`supaInsert ${tabela} erro ${res.status}:`, err);
  }
  return res.json().catch(()=>({}));
}
async function supaPatch(tabela, filtro, body) {
  const url = `${SUPA_URL}/rest/v1/${tabela}?${filtro}`;
  const opts = { method: 'PATCH', headers: { ...HEADERS, 'Prefer': 'return=minimal' }, body: JSON.stringify(body) };
  let res = await fetch(url, opts);
  if (res.status === 401 && await renovarToken()) {
    res = await fetch(url, { ...opts, headers: { ...HEADERS, 'Prefer': 'return=minimal' } });
  }
  if (!res.ok) {
    const err = await res.text().catch(()=>'');
    console.error(`supaPatch ${tabela} erro ${res.status}:`, err);
  }
  return res.status;
}

// ============================================================
//  AUTO LOGIN — usa sessão do Supabase Auth (compartilhada com Hub)
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  // Sessão do Hub válida, mas sem área aqui. Guardado para a tela de login
  // dizer o motivo em vez de devolver um formulário em branco para quem
  // acabou de entrar no Hub e já está autenticado.
  let sessaoSemAcesso = false;
  try {
    const LS_KEY = 'sb-vishxwdxqiygbxmtpfoy-auth-token';
    const sbToken = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    let accessToken = sbToken.access_token;
    const refreshToken = sbToken.refresh_token;

    if (!accessToken && !refreshToken) throw new Error('sem token');

    // Tenta usar o access_token atual
    if (accessToken) {
      const res = await fetch(`${SUPA_URL}/auth/v1/user`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + accessToken }
      });
      if (res.ok) {
        const userData = await res.json();
        if (userData.id && temAcessoStonni(userData.user_metadata ?? {})) {
          await carregarUsuario(userData, accessToken);
          return;
        }
        if (userData.id) sessaoSemAcesso = true;
      }
    }

    // access_token expirado — tenta renovar com refresh_token
    if (refreshToken) {
      const refRes = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      if (refRes.ok) {
        const newSession = await refRes.json();
        if (newSession.access_token) {
          // Salva nova sessão no localStorage
          localStorage.setItem(LS_KEY, JSON.stringify({
            access_token: newSession.access_token,
            refresh_token: newSession.refresh_token || refreshToken,
            expires_at: Math.floor(Date.now()/1000) + (newSession.expires_in || 3600)
          }));
          const userRes = await fetch(`${SUPA_URL}/auth/v1/user`, {
            headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + newSession.access_token }
          });
          if (userRes.ok) {
            const userData = await userRes.json();
            if (userData.id && temAcessoStonni(userData.user_metadata ?? {})) {
              await carregarUsuario(userData, newSession.access_token);
              return;
            }
            if (userData.id) sessaoSemAcesso = true;
          }
        }
      }
    }
  } catch(e) {}

  // Sem sessão válida — mostra login
  document.getElementById('login-screen').classList.remove('hidden');
  if (sessaoSemAcesso) document.getElementById('login-error').textContent = MSG_SEM_ACESSO;
});
